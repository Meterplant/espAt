name: Build ESP-AT (ESP32 WROOM-32 + Ethernet)

on:
  workflow_dispatch: {}   # run manually from Actions tab
  push:
    paths:
      - '**.yml'
      - 'components/**'
      - 'module_config/**'
      - 'build.py'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # esp-at needs submodules

      - name: Select module & defaults
        run: |
          mkdir -p build
          # Tell esp-at which module you want
          echo -e '{"platform":"PLATFORM_ESP32","module":"WROOM-32","silence":1}' > build/module_info.json

          # Start from the WROOM defaults and append Ethernet enables
          cp module_config/module_esp32_default/sdkconfig_silence.defaults eth.defaults
          {
            echo 'CONFIG_AT_ETHERNET_SUPPORT=y'
            echo 'CONFIG_AT_ETH_LAN8720=y'
            # Adjust these to match your wiring/clock:
            # echo 'CONFIG_ETH_PHY_ADDR=1'
            # echo 'CONFIG_ETH_MDC_GPIO=23'
            # echo 'CONFIG_ETH_MDIO_GPIO=18'
            # echo 'CONFIG_ETH_RMII_CLK_INPUT=y'
            # echo 'CONFIG_ETH_RMII_CLK_IN_GPIO=0'
          } >> eth.defaults

          # Export for subsequent steps
          echo "silence_sdkconfig=$GITHUB_WORKSPACE/eth.defaults" >> $GITHUB_ENV
          echo "IDF_TARGET=esp32" >> $GITHUB_ENV

      - name: Install toolchain & deps
        run: ./build.py install

      - name: Build
        run: ./build.py build

      - name: Show module & config used
        run: |
          echo "silence_sdkconfig=$silence_sdkconfig"
          cat build/module_info.json
          grep -E 'CONFIG_AT_ETHERNET_SUPPORT|CONFIG_AT_ETH_' eth.defaults || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-wroom-at-ethernet
          path: |
            sdkconfig
            build/*.elf
            build/*.map
            build/*.bin
            build/bootloader/*.bin
            build/partition_table/*.bin
            build/customized_partitions/*
            build/flasher_args.json
            build/download.config
            build/factory/*
